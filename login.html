<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/login.css">
    
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Estoque Fácil</h1>
            <p>Sistema de controle de estoque</p>
        </header>

        <main class="login-container">
            <h2>Acesso ao Sistema</h2>
            <p>Faça login com sua conta do Google para continuar.</p>

            <!-- Botão de login com Google -->
            <button id="btn-login-google" class="btn-google">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Entrar com o Google
            </button>
        </main>

        <footer>
            <p>&copy; 2026 Estoque Fácil</p>
        </footer>
    </div>

    <!-- 1. SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Seu arquivo de conexão (conectar.js) -->
    <script src="js/conectar.js"></script>

    <!-- 3. Lógica de Login com Google -->
    <script>
        const btnLoginGoogle = document.getElementById('btn-login-google');

        btnLoginGoogle.addEventListener('click', async () => {
            try {
                const { data, error } = await _supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        // Define para onde o usuário vai ser redirecionado após o login com sucesso
                        redirectTo: window.location.origin + '/index.html'
                    }
                });

                if (error) {
                    console.error('Erro no login:', error.message);
                    alert('Erro ao tentar fazer login com o Google: ' + error.message);
                }
            } catch (err) {
                console.error('Erro inesperado:', err);
                alert('Ocorreu um erro inesperado durante o login.');
            }
        });
    </script>
</body>
</html>
