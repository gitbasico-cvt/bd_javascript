<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fácil - Listar Produtos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Estoque Fácil</h1>
            <p>Sistema de controle de estoque</p>
        </header>

        <main>
            <section>
                <h2>Listar produtos</h2>
                <p>Visualizar os produtos cadastrados.</p>
            </section>

            <section id="lista-produtos">
                <!-- Conteúdo gerado dinamicamente via Supabase -->
                <p>Carregando produtos...</p>
            </section>
        </main>

        <footer>
            <a href="index.html">← Voltar para o menu principal</a>
        </footer>
    </div>

    <!-- 1. SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Seu arquivo único de conexão -->
    <script src="js/conectar.js"></script>

    <!-- 3. Script para verificar autenticação, buscar e exibir os produtos -->
    <script>
        async function verificarEListar() {
            const containerProdutos = document.getElementById('lista-produtos');

            try {
                // Verifica se o usuário está autenticado
                const { data: { session }, error: sessionError } = await _supabase.auth.getSession();

                if (!session || sessionError) {
                    // Se não houver sessão ativa, redireciona para a tela de login
                    window.location.href = 'login.html';
                    return;
                }

                // Busca os dados na tabela 'produtos' do Supabase
                const { data, error } = await _supabase.from('produtos').select('*');

                if (error) {
                    console.error('Erro ao buscar produtos:', error);
                    containerProdutos.innerHTML = '<p>Erro ao carregar os produtos do banco de dados.</p>';
                    return;
                }

                // Limpa o container
                containerProdutos.innerHTML = '';

                if (!data || data.length === 0) {
                    containerProdutos.innerHTML = '<p>Nenhum produto cadastrado.</p>';
                    return;
                }

                // Cria uma lista ou elementos para exibir os produtos mantendo o padrão
                const ul = document.createElement('ul');
                data.forEach(produto => {
                    let li = document.createElement('li');
                    // Ajuste 'produto.nome' caso sua coluna no banco tenha outro nome (ex: descricao, preco, etc)
                    li.textContent = `Produto: ${produto.produto}  / Quantidade: ${produto.quantidade}`; 
                    ul.appendChild(li);
                });

                containerProdutos.appendChild(ul);

            } catch (err) {
                console.error('Erro inesperado:', err);
                containerProdutos.innerHTML = '<p>Erro de conexão com o servidor.</p>';
            }
        }

        // Executa a verificação e listagem assim que a página carregar
        verificarEListar();
    </script>
</body>
</html>
